name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  # If we run CI on all branches then we end up doing duplicate work for
  # branches which are also PRs.
  push:
    branches:
    - main
    - kripken/*
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: lint
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      # Keep this in sync with clang-format-diff.sh
      LLVM_VERSION: 21
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        submodules: true
        fetch-depth: 0
    - name: install tools
      run: |
        pip3 install -r requirements-dev.txt
        sudo apt install lsb-release wget software-properties-common gnupg
        wget https://apt.llvm.org/llvm.sh
        sudo chmod +x llvm.sh
        sudo ./llvm.sh ${LLVM_VERSION}
        sudo apt-get install clang-format clang-format-${LLVM_VERSION} clang-tidy-${LLVM_VERSION}
    - run: ruff check
    - run: ./scripts/clang-format-diff.sh
    - name: clang-tidy
      run: |
        # clang-tidy requires compile_commands.json generated by cmake
        cmake . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        ./scripts/clang-tidy-diff.sh

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Test on the oldest support Ubuntu version in addition to `latest`.
        # Build using the oldest support macOS version.  For emsdk this is
        # currently macos-13, but unfortunately that doesn't exist in github
        # actions so we settle for macos-14.
        os: [ubuntu-22.04, ubuntu-latest]
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        submodules: true
    - name: install Python dev dependencies
      run: pip3 install -r requirements-dev.txt

    - name: gen-s-parser
      run: ./scripts/gen-s-parser.py | diff src/gen-s-parser.inc -
      if: startsWith(matrix.os, 'ubuntu')

    - name: install ninja (linux)
      run: sudo apt-get install ninja-build
      if: startsWith(matrix.os, 'ubuntu')

    - name: install ninja (macos)
      run: brew install ninja
      if: startsWith(matrix.os, 'macos')

    - name: install ninja (win)
      run: choco install ninja
      if: startsWith(matrix.os, 'windows')

    - name: install v8
      run: |
        npm install jsvu -g
        jsvu --os=default --engines=v8

    - name: mkdir
      run: mkdir -p out

    - name: cmake (linux)
      run: cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=out/install
      if: startsWith(matrix.os, 'ubuntu')

    - name: cmake (macos)
      run: cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=out/install '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'
      if: startsWith(matrix.os, 'macos')

    - name: cmake (win)
      # -G "Visual Studio 15 2017"
      run: cmake -S . -B out -DCMAKE_INSTALL_PREFIX=out/install
      if: startsWith(matrix.os, 'windows')

    - name: build
      run: cmake --build out --config Release -v

    - name: install
      run: cmake --install out --config Release

    - name: strip
      run: find out/install/ -type f -perm -u=x -exec strip -x {} +
      if: ${{ !startsWith(matrix.os, 'windows') }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: out/install

    - name: test binaryen-lit
      run: python out/bin/binaryen-lit -vv test/lit/parse-error.wast

    - name: test
      run: python check.py --binaryen-bin=out/bin

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
