      with:
        python-version: '3.x'
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        submodules: true
    - name: install clang 18
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
    - name: install ninja
      run: sudo apt-get install ninja-build
    - name: install v8
